<app-switcher />
<div class="grid grid-cols-12 authentication mx-0 text-defaulttextcolor text-defaultsize">
  <div class="xxl:col-span-7 xl:col-span-7 lg:col-span-12 col-span-12">
    <div class="grid grid-cols-12  items-center h-full">
      <div class="xxl:col-span-3 xl:col-span-3 lg:col-span-3 md:col-span-3 sm:col-span-2"></div>
      <div class="xxl:col-span-6 xl:col-span-6 lg:col-span-6 md:col-span-6 sm:col-span-8 col-span-12">
        <div class="p-[3rem]">
          <div class="mb-4">
            <a aria-label="anchor" routerLink="/dashboard">
              <img src="./images/logo.png" alt="" class="authentication-brand desktop-logo">
              <img src="./images/brand-logos/desktop-dark.png" alt="" class="authentication-brand desktop-dark">
            </a>
          </div>
          <router-outlet />
        </div>
      </div>
      <div class="xxl:col-span-3 xl:col-span-3 lg:col-span-3 md:col-span-3 sm:col-span-2"></div>
    </div>
  </div>
  <div class="xxl:col-span-5 xl:col-span-5 lg:col-span-5 col-span-12 xl:block hidden px-0 custom-blue-background">
    <div class="authentication-cover  ">
      <div class="aunthentication-cover-content rounded">
        <div class="swiper keyboard-control authentication">
          <owl-carousel-o [options]="customOptions" [dir]="customOptions.rtl ? 'rtl' : 'ltr'">
            @for(slide of slidesStore; track $index){

            <ng-container>
              <ng-template carouselSlide>
                <div class="swiper-wrapper custom-blue-bg">
                  <div class="swiper-slide">
                    <div class="text-white text-center p-[3rem] flex items-center justify-center">
                      <div>
                        <div class="mb-[3rem]">
                          <img [src]="slide.img" alt="" class="authentication-image">
                        </div>
                        <h6 class="font-semibold text-[1rem]">Iniciar Sesion</h6>
                        <p class="font-normal text-[.875rem] opacity-[0.7]">
                          Cintegran es una empresa que se especializa en el desarrollo de soluciones
                          tecnológicas para la gestión empresarial. Su principal operación es el desarrollo de
                          aplicaciones web, diseñadas para mejorar las actividades de sus clientes </p>
                      </div>
                    </div>
                  </div>
                </div>
              </ng-template>
            </ng-container>
            }
          </owl-carousel-o>


          <div class="swiper-pagination"></div>
        </div>
      </div>
    </div>
  </div>
</div>
