<form [formGroup]="formCartaPorte">

<div class="grid grid-cols-12 gap-4">
    <h5 class="mt-3">Mercancias</h5>
    <div class="col-span-12 sm:col-span-12 md:col-span-12">
        <div class="row">
            <div class="table-responsive">

                <table class="table text-nowrap table-bordered mb-3">
                    <thead>
                        <tr>
                            <th style="width: 15%;">Mercancia</th>
                            <th>Descripción</th>
                            <th>Unidad</th>
                            <th>Dimensiones</th>
                            <th>Distancia</th>
                            <th style="width: 3%;">Eliminar</th>
                        </tr>
                    </thead>
                    <tbody formArrayName="mercancias">
                    </tbody>
                </table>
                <button type="button"
                    class="mt-4 flex items-center justify-center w-10 h-10 rounded-full  mx-auto  ti-btn-primary "
                    data-hs-overlay="#hs-extralarge-modal3">
                    <i class="ri-add-line "></i>
                </button>
            </div>
        </div>
    </div>
</div>
