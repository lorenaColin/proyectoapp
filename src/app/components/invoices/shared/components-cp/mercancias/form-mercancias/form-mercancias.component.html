<form [formGroup]="formCartaPorte">

    <div class="grid grid-cols-12 gap-4">
        <h5 class="mt-3">Mercancias</h5>
        <div class="col-span-12 sm:col-span-12 md:col-span-12">
            <div class="row">
                <div class="table-responsive">

                    <table class="table text-nowrap table-bordered mb-3">
                        <thead>
                            <tr>
                                <th style="width: 15%;">Mercancia</th>
                                <th>Descripción</th>
                                <th>Unidad</th>
                                <th>Dimensiones</th>
                                <th>Distancia</th>
                                <th style="width: 3%;">Eliminar</th>
                            </tr>
                        </thead>
                        <tbody formArrayName="mercancias">
                            <tr *ngFor="let m of mercancias.controls; let i = index" [formGroupName]="i">
                                <td>{{ m.get('BienesTransp')?.value }}</td>
                                <td>{{ m.get('descripcion')?.value }}</td>
                                <td>{{ m.get('ClaveUnidad')?.value }}</td>
                                <td>{{ m.get('dimensiones')?.value }}</td>
                                <td>{{ m.get('distancia')?.value }}</td>
                                <td>
                                  <button type="button" (click)="removeMercancia(i)"></button>
                                  <i class="ri-delete-bin-line"></i>
                                </td>
                            </tr>
                          </tbody>
                    </table>
                    <button type="button"
                        class="mt-4 flex items-center justify-center w-10 h-10 rounded-full  mx-auto  ti-btn-primary "
                        data-hs-overlay="#hs-extralarge-modal8">
                        <i class="ri-add-line "></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</form>


<div id="hs-extralarge-modal8" class="hs-overlay hidden fixed ti-modal [--overlay-backdrop:static]"
  data-hs-overlay-keyboard="false">
  <div class="hs-overlay-open:mt-7 ti-modal-box mt-0 ease-out lg:!max-w-4xl lg:w-full m-3 lg:!mx-auto">
    <div class="ti-modal-content">
      <div class="ti-modal-header">
        <h6 class="ti-modal-title">Mercancias</h6>
      </div>
      <app-form-invoice-mercancia />
    </div>
  </div>
</div>
