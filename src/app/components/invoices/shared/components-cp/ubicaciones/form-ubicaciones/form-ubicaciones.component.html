<form [formGroup]="formCartaPorte">
    <div class="grid grid-cols-12 gap-4">
        <h5 class="col-span-12 mt-3">Ubicaciones</h5>
        <div class="col-span-12">
            <div class="table-responsive">
                <table class="table text-nowrap table-bordered mb-3" id="tableUbication">
                    <thead>
                        <tr>
                            <th style="width: 5%;">Tipo</th>
                            <th style="width: 25%;">RFC</th>
                            <th>Datos Generales</th>
                            <th style="width: 15%;">F. Hora</th>
                            <th style="width: 15%;">Distancia</th>
                            <th style="width: 3%;">Eliminar</th>
                        </tr>
                    </thead>

                    <tbody formArrayName="ubicaciones" id="tbodyUbication">
                        <tr *ngFor="let ubicacion of ubicaciones.controls; let i = index" [formGroupName]="i">
                            <td>
                                <h5>{{ ubicacion.get('tipo')?.value }}</h5>

                            </td>
                            <td>
                                <div class="mb-4 relative">
                                    <div class="input-group">
                                        <input type="text" class="form-control" name="rfc" id="rfc"
                                            formControlName="rfc" maxlength="8" (input)="onInput($event, i, 'rfc')"
                                            (keydown)="onKeyDown($event)"
                                            [ngClass]="{'is-invalid': ubicacion.get('rfc')?.hasError('notFound') && ubicacion.get('rfc')?.touched}">

                                        <div class="input-group-text">
                                            <i class="ri-add-line"></i>
                                        </div>

                                        <ul *ngIf="ubicacion.get('tipo')?.value === 'Origen' && filteredRFCOrigen.length > 0"
                                            class="absolute rounded-lg mt-2 w-full bg-white border border-gray-300 z-10">
                                            <li *ngFor="let ubic of filteredRFCOrigen; let i = index"
                                            (click)="selectSerieWrapper(ubic, 'Origen')"

                                                [ngClass]="{'bg-gray-200': i === selectedIndex}"
                                                class="p-2 cursor-pointer hover:bg-gray-300">
                                                {{ ubic.idUbicacion }} - {{ ubic.rfc }}
                                            </li>
                                        </ul>

                                        <ul *ngIf="ubicacion.get('tipo')?.value === 'Destino' && filteredRFCDestino.length > 0"
                                            class="absolute rounded-lg mt-2 w-full bg-white border border-gray-300 z-10">
                                            <li *ngFor="let ubic of filteredRFCDestino; let i = index"
                                            (click)="selectSerieWrapper(ubic, 'Destino')"

                                            [ngClass]="{'bg-gray-200': i === selectedIndex}"
                                            class="p-2 cursor-pointer hover:bg-gray-300">
                                            {{ ubic.idUbicacion }} - {{ ubic.rfc }}
                                        </li>
                                        </ul>
                                    </div>
                                </div>
                            </td>


                            <td>
                                <textarea formControlName="datosGenerales" class="form-control" rows="3"></textarea>
                            </td>

                            <td>
                                <input type="datetime-local" formControlName="fechaHora" class="form-control" />
                            </td>

                            <td>
                                <input type="number" formControlName="distancia" class="form-control" />
                            </td>

                            <td *ngIf="buttonDelete">
                                <a aria-label="anchor" href="javascript:void(0);"
                                    (click)="ubicacion.get('tipo')?.value !== 'Origen' ? removeProducto(i) : null"
                                    class="ti-btn ti-btn-danger !rounded-full">
                                    <i class="ri-delete-bin-line"></i>
                                </a>
                            </td>
                        </tr>
                        <tr *ngIf="buttonAdd">
                            <td colspan="6">
                                <div class="text-center">
                                    <a aria-label="Agregar ubicación" href="javascript:void(0);"
                                        (click)="addUbicacion('Destino')"
                                        class="ti-btn ti-btn-secondary !rounded-full mt-1 mb-1">
                                        <i class="ri-add-circle-line"></i> Agregar
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>

                </table>

            </div>
        </div>
    </div>

    <!-- Información adicional debajo de la tabla -->
    <div class="grid grid-cols-12 gap-4">
        <div class="col-span-12 sm:col-span-12 md:col-span-4">
            <label for="pBruto" class="form-label">P. Bruto: </label>
            <input type="text" class="form-control" disabled>
        </div>
        <div class="col-span-12 sm:col-span-12 md:col-span-4">
            <label for="uPeso" class="form-label">U. Peso: </label>
            <select class="form-control" id="uPeso">
                <option value="">Selecciona unidad</option>
                <!-- @foreach($unidadesPeso as $unidad)
                <option value="{{ $unidad->key_unit }}">{{ $unidad->name }}</option>
                @endforeach -->
            </select>
        </div>
        <div class="col-span-12 sm:col-span-12 md:col-span-4">
            <label for="rDevolucion" class="form-label">R. Devolución</label>
            <select class="form-control" id="rDevolucion">
                <option value="No">No</option>
                <option value="Si">Si</option>
            </select>
        </div>
    </div>
</form>
<div id="loader" *ngIf="showLoader">
    <img src="images/loader.svg" alt="" />
</div>
