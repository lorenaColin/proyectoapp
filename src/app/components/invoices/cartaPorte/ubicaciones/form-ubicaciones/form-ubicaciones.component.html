<div>
    <form [formGroup]="myForm" class="grid grid-cols-3 gap-6 p-6  rounded-lg">

        <div class="col-span-1">
            <label for="tipo" class="block text-sm font-medium ">Tipo</label>
            <select id="tipo" formControlName="tipo"
                class="mt-1 block w-full rounded-md  focus:ring-blue-500 focus:border-blue-500">
                <option>Selecciona Tipo</option>
                <option>Selecciona origen</option>
                <option>Selecciona destino</option>


            </select>
            <span *ngIf="isValidField('tipo')" class="text-[#EE312A]">
                {{ getFieldError('tipo') }}
            </span>
        </div>

      

        <div class="col-span-2">
            <label for="rfc" class="block text-sm font-medium">RFC</label>
            <input id="rfc" formControlName="rfc" class="mt-1 block w-full rounded-md focus:border-blue-500 sm:text-sm"
                minlength="1" maxlength="25" oninput="this.value = this.value.toUpperCase();" />
            <span *ngIf="isValidField('rfc')" class="text-[#EE312A]">
                {{ getFieldError('rfc') }}
            </span>
        </div>
        <div class="col-span-1">
            <label for="idUbicacion" class="block text-sm font-medium ">IdUbicacion</label>
            <input type="text" id="idUbicacion" formControlName="idUbicacion"
                class="mt-1 block w-full rounded-md  focus:ring-blue-500 focus:border-blue-500">
            <span *ngIf="isValidField('idUbicacion')" class="text-[#EE312A]">
                {{ getFieldError('idUbicacion') }}
            </span>
        </div>
        <div class="col-span-2">
            <label for="nombre" class="block text-sm font-medium ">Nombre</label>
            <input type="text" id="nombre" formControlName="nombre"
                class="mt-1 block w-full rounded-md  focus:ring-blue-500 focus:border-blue-500">
            <span *ngIf="isValidField('nombre')" class="text-[#EE312A]">
                {{ getFieldError('nombre') }}
            </span>
        </div>
        <div class="col-span-1">
            <label for="numRegTrib" class="block text-sm font-medium ">Num.Reg.Trib</label>
            <input type="text" id="numRegTrib" formControlName="numRegTrib"
                class="mt-1 block w-full rounded-md  focus:ring-blue-500 focus:border-blue-500">
            <span *ngIf="isValidField('numRegTrib')" class="text-[#EE312A]">
                {{ getFieldError('numRegTrib') }}
            </span>
        </div>
        <div class="col-span-1">
            <label for="residenciaFiscal" class="block text-sm font-medium ">Residencia Fiscal</label>
            <select id="residenciaFiscal" formControlName="residenciaFiscal"
                class="mt-1 block w-full rounded-md  focus:ring-blue-500 focus:border-blue-500">
                <option>Selecciona País</option>

            </select>
            <span *ngIf="isValidField('residenciaFiscal')" class="text-[#EE312A]">
                {{ getFieldError('residenciaFiscal') }}
            </span>
        </div>


        <div class="mt-6 flex items-center">
            <input id="domicilio" type="checkbox"
                class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
            <label for="domicilio"  class="ml-2 text-sm">Domicilio</label>
        </div>



    </form>
</div>



<div class="flex justify-between mb-4 mt-5">
    <div class="ms-3">
        <button type="button" class="ti-btn ti-btn-danger-full text-white !font-medium" (click)="closeModal()"
            data-hs-overlay="#hs-extralarge-modal1">
            Cancelar
        </button>
    </div>
    <div class="mr-3">
        <button class="ti-btn ti-btn-primary-full text-white !font-medium" (click)="onSubmit()">
            Crear
        </button>
    </div>
</div>
