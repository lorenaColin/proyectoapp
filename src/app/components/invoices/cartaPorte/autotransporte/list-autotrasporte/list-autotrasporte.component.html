<div class="grid grid-cols-12 gap-x-6">
  <div class="xl:col-span-12 col-span-12">
    <div class="box mt-4">
      <div class="box-body">
        <div class="contact-header">
          <div class="sm:flex block items-center justify-between">
            <div class="h5 font-semibold mb-0">Carta porte -> Auto Trasporte </div>
            <div class="flex sm:mt-0 mt-2 items-center">
              <div class="input-group">
                <input type="text" class="form-control !rounded-s-sm w-full !bg-light !border-0"
                  placeholder="Buscar Auto Trasporte " aria-describedby="search-contact-member" autocomplete="off" />
                <button aria-label="button" type="button" class="ti-btn ti-btn-light !rounded-s-none !mb-0"
                  id="search-contact-member">
                  <i class="ri-search-line text-[#8C9097]"></i>
                </button>
              </div>
              <div class="hs-tooltip ti-main-tooltip">
                <button type="button"
                  class="hs-tooltip-toggle ti-btn ti-btn-icon ti-btn-primary !ms-2 w-[2.313rem] h-[2.313rem]"
                  data-hs-overlay="#hs-extralarge-modal1">
                  <i class="ri-add-line"></i>
                  <span
                    class="hs-tooltip-content hs-dropdown-toggle ti-main-tooltip-content py-1 px-2 !bg-black !text-xs !font-medium !text-white shadow-sm"
                    role="tooltip">
                    Crear Auto Trasporte
                  </span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  @for (auto of listadoAutos; track $index) {
  <div class="xxl:col-span-3 xl:col-span-4 lg:col-span-6 md:col-span-6 sm:col-span-12 col-span-12">
    <div class="box shadow-md rounded-md overflow-hidden">
      <div class="box-body p-4 bg-white">
        <div class="flex items-center mb-4">
          <span class="avatar avatar-md avatar-rounded me-4">
            <img src="./images/faces/1.jpg" alt="" />
          </span>
          <div>
            <p class="mb-0 font-semibold text-[.875rem] text-primary">
              {{ auto.placaVM }}
            </p>
            <p class="mb-0 text-[.625rem] font-semibold text-[#000000]">
              {{ auto.configVehicular }}
            </p>
          </div>
        </div>
        <div class="mb-4 flex items-center justify-between">
          <div class="flex items-center">
            <p class="mb-0 font-semibold text-[#000000]">
              Año:
            </p>
            <span class="text-[#000000] ml-2">{{ auto.anioModeloVM }}</span>
          </div>
        </div>
        <div class="flex items-center justify-end">
          <div class="ltr:float-right rtl:float-left text-[0.75rem] font-semibold text-[#000000] text-end">
            <button type="button" (click)="editAutotransport(auto.id)" data-hs-overlay="#hs-extralarge-modal1"
              class="ti-btn ti-btn-primary-full text-[#000000] !font-medium">
              Ver
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  }
</div>
<div id="hs-extralarge-modal1" class="hs-overlay hidden ti-modal [--overlay-backdrop:static] fixed"
  data-hs-overlay-keyboard="false">
  <div class="hs-overlay-open:mt-7 ti-modal-box mt-0 ease-out lg:!max-w-4xl lg:w-full m-3 lg:!mx-auto">
    <div class="ti-modal-content">
      <div class="ti-modal-header">
        <h6 class="ti-modal-title">Auto Transporte</h6>
      </div>
      <app-form-autotrasporte [productoHijo]="auto" (respuesta)="responseAutotransport($event)" />
    </div>
  </div>
</div>

<div id="loader" *ngIf="showLoader">
    <img src="images/loader.svg" alt="" />
  </div>
