<div>
    <form  [formGroup]="myForm"  class="grid grid-cols-3 gap-6 p-6  rounded-lg">

        <div class="col-span-1">
            <label for="tipo" class="block text-sm font-medium ">Tipo</label>
            <select id="tipo" formControlName="tipo"
                class="mt-1 block w-full rounded-md ">
                <option>Seleccionar Operador</option>
                <option>Operador</option>
                <option>Proprietario</option>
                <option>Arrendador</option>
                <option>Notificador</option>
                <option>Integrante de Coordinados</option>

                

            </select>
            <span *ngIf="isValidField('tipo')" class="text-[#EE312A]">
                {{ getFieldError('tipo') }}
            </span>
        </div>
        <div class="col-span-1">
            <label for="rfc" class="block text-sm font-medium ">RFC</label>
            <input type="text" id="rfc" formControlName="rfc"
                class="mt-1 block w-full rounded-md ">
                <span *ngIf="isValidField('rfc')" class="text-[#EE312A]">
                    {{ getFieldError('rfc') }}
                </span>
        </div>
        <div class="col-span-1">
            <label for="licencia" class="block text-sm font-medium ">Num. Licencia</label>
            <input type="text" id="licencia" formControlName="licencia" maxlength="16" minlength="6"
                class="mt-1 block w-full rounded-md ">
                <span *ngIf="isValidField('licencia')" class="text-[#EE312A]">
                    {{ getFieldError('licencia') }}
                </span>
        </div>
        <div class="col-span-1">
            <label for="nombre" class="block text-sm font-medium ">Nombre</label>
            <input type="text" id="nombre" formControlName="nombre"  minlength="1"
                class="mt-1 block w-full rounded-md ">
                <span *ngIf="isValidField('nombre')" class="text-[#EE312A]">
                    {{ getFieldError('nombre') }}
                </span>
        </div>
        <div class="col-span-1">
            <label for="numRegTrib." class="block text-sm font-medium ">Num. Reg. Trib.</label>
            <input type="text" id="numRegTrib" formControlName="numRegTrib"  maxlength="40" minlength="6"
                class="mt-1 block w-full rounded-md ">
                <span *ngIf="isValidField('numRegTrib')" class="text-[#EE312A]">
                    {{ getFieldError('numRegTrib') }}
                </span>
        </div>
        <div class="col-span-1">
            <label for="rFiscal" class="block text-sm font-medium ">R. Fiscal</label>
            <input type="text" id="rFiscal" formControlName="rFiscal"
                class="mt-1 block w-full rounded-md ">
                <span *ngIf="isValidField('rFiscal')" class="text-[#EE312A]">
                    {{ getFieldError('rFiscal') }}
                </span>
        </div>
        
        <div class="mt-6 flex items-center">
            <input id="domicilio" type="checkbox"
                class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
            <label for="domicilio" class="ml-2 text-sm ">Domicilio</label>
        </div>

    </form>
</div>


<div class="flex justify-between mb-4 mt-5">
    <div class="ms-3">
        <button type="button" class="ti-btn ti-btn-danger-full text-white !font-medium"
            data-hs-overlay="#hs-extralarge-modal1">

            Cancelar
        </button>
    </div>
    <div class="mr-3">
        <button class="ti-btn ti-btn-primary-full text-white !font-medium">
            Crear
        </button>
    </div>
</div>
