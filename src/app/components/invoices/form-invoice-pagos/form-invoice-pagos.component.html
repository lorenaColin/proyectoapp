<form [formGroup]="myForm" class="gap-6 p-4 rounded-lg">

    <div class=" mt-6 hs-accordion-group">
        <!-- Relacionados -->
        <div class="hs-accordion active overflow-hidden bg-white dark:bg-bodybg border -mt-px first:rounded-t-sm last:rounded-b-sm dark:bg-bgdark dark:border-white/10"
            id="hs-secondary-heading-1">
            <button
                class="hs-accordion-toggle hs-accordion-active:text-white hs-accordion-active:bg-secondary group py-4 px-5 inline-flex items-center justify-between gap-x-3 w-full font-semibold text-start text-gray-800 transition hover:text-gray-500 dark:hs-accordion-active:text-white dark:text-gray-200 dark:hover:text-white/80"
                aria-controls="hs-secondary-collapse-1" type="button">
                Relacionados
                <svg class="hs-accordion-active:hidden hs-accordion-active:text-white hs-accordion-active:group-hover:text-white block w-3 h-3 text-gray-600 group-hover:text-gray-500 dark:text-[#8c9097] dark:text-white/50"
                    width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2 5L8.16086 10.6869C8.35239 10.8637 8.64761 10.8637 8.83914 10.6869L15 5"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
                <svg class="hs-accordion-active:block hs-accordion-active:text-white hs-accordion-active:group-hover:text-white hidden w-3 h-3 text-gray-600 group-hover:text-gray-500 dark:text-[#8c9097] dark:text-white/50"
                    width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2 11L8.16086 5.31305C8.35239 5.13625 8.64761 5.13625 8.83914 5.31305L15 11"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
            </button>
            <div id="hs-secondary-collapse-1 mt-4 "
                class="hs-accordion-content w-full overflow-hidden transition-[height] duration-300"
                aria-labelledby="hs-secondary-heading-1">
                <!-- <form [formGroup]="myForm" class="gap-6 p-4 rounded-lg"> -->
                <!-- <pre> {{myForm.value|json}}</pre> -->
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="text-sm font-medium">Buscador Clientes</label>
                        <input type="text" formControlName="buscador"
                            class="mt-1 block w-full rounded-md focus:border-blue-500 sm:text-sm" maxlength="254"
                            oninput="this.value = this.value.toUpperCase();" placeholder="Buscar cliente" />
                        <span *ngIf="isValidField('buscador')" class="text-[#EE312A]">
                            {{ getFieldError('buscador') }}
                        </span>
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Folio Temporal</label>
                        <input type="text" formControlName="folio"
                            class="mt-1 block w-full rounded-md focus:border-blue-500 sm:text-sm" readonly />
                    </div>
                    <div>
                        <label class="block text-sm font-medium ">UUID </label>
                        <input type="text" id="uuid" formControlName="uuid"
                            class="mt-1 block w-full rounded-md focus:border-blue-500 sm:text-sm" maxlength="254"
                            maxlength="254" value="" readonly />
                        <span *ngIf="isValidField('uuid')" class="text-[#EE312A]">
                            {{ getFieldError('uuid') }}
                        </span>

                    </div>
                    <div>
                        <label class="block text-sm font-medium ">Parcialidad</label>
                        <input type="text" id="parcialidad" formControlName="parcialidad"
                            class="mt-1 block w-full rounded-md focus:border-blue-500 sm:text-sm" maxlength="254"
                            value="" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium ">Monto Factura</label>
                        <input type="number" id="factura" formControlName="factura"
                            class="mt-1 block w-full rounded-md focus:border-blue-500 sm:text-sm" maxlength="254"
                            value="" readonly />
                    </div>
                    <div>
                        <label class="block text-sm font-medium ">Fecha Pago</label>
                        <input type="text" id="fechaPago" formControlName="fechaPago"
                            class="mt-1 block w-full rounded-md focus:border-blue-500 sm:text-sm" maxlength="254"
                            value="" />
                        <span *ngIf="isValidField('uuid')" class="text-[#EE312A]">
                            {{ getFieldError('uuid') }}
                        </span>

                    </div>
                    <!-- <div>
                            <label class="block text-sm font-medium ">Forma de Pago </label>

                                class="mt-1 block w-full rounded-md focus:border-blue-500 sm:text-sm" maxlength="254"
                                value="" />
                                <span *ngIf="isValidField('formaPago')" class="text-[#EE312A]">
                                    {{ getFieldError('formaPago') }}
                                </span>

                        <label class="block text-sm font-medium">Forma de Pago</label>
                        <select id="formaPago" formControlName="formaPago"

                            <option *ngFor="let formaPago of listadoFormaPago" [value]="formaPago.clave">
                                {{ formaPago.descripcion }}
                            </option>
                        </select>
                        <span *ngIf="isValidField('formaPago')" class="text-[#EE312A]">
                            {{ getFieldError('formaPago') }}
                        </span>
                    </div>

                    </div>
                    <div>

                    <div>

                    <div>

                        <input type="text" id="ctaOrdenante" formControlName="ctaOrdenante"

                    </div>
                    <div>
                        <label class="block text-sm font-medium ">R.F.C Cta Beneficiaria</label>
                        <input type="text" id="ctaBeneficiaria" formControlName="ctaBeneficiaria"
