<form [formGroup]="formTraslado" autocomplete="off">
    <!-- <pre> {{ formTraslado.value | json }} </pre> -->
    <div class="grid grid-cols-12 gap-x-6">
        <div class="xl:col-span-12 col-span-12">
            <div class="box mt-4">
                <div class="box-body">
                    <div class="contact-header">
                        <div class="sm:flex block items-center justify-between">
                            <div class="h5 font-semibold mb-5">CARTA PORTE</div>

                        </div>
                    </div>
                    <div class="grid grid-cols-12 gap-4">

                        <div class="col-span-12 sm:col-span-12 md:col-span-3 relative">
                            <label for="serie_folio" class="form-label text-[.875rem] text-black">Serie y Folio:</label>
                            <div class="input-group">
                                <input type="text" class="form-control" name="serie_folio" id="serie_folio"
                                    formControlName="serie_folio" (input)="onInputReceptorJun($event, 'series')"
                                    (keydown)="onKeyDown($event)"
                                    [ngClass]="{'is-invalid': isValidField('serie_folio')}">
                                <div class="input-group-text" data-hs-overlay="#hs-extralarge-modal2">
                                    <i class="ri-add-line"></i>
                                </div>
                            </div>
                            <span *ngIf="formTraslado.get('serie_folio')?.hasError('notFound') "
                                class="text-[#EE312A] text-sm">
                                Este código de serie no se encuentra .
                            </span>
                            <span *ngIf="isValidField('serie_folio')" class="text-[#EE312A] text-sm">
                                {{ getFieldError('serie_folio') }}
                            </span>


                            <ul *ngIf="filteredSeries.length > 0"
                                class="absolute dark:bg-white bg-gray-400 border-gray-300 rounded-lg mt-2 w-full">
                                <li *ngFor="let series of filteredSeries; let i = index" (click)="selectSerie(series)"
                                    [ngClass]="{'bg-gray-200': i === selectedIndex}" class="text-black">
                                    {{ series.serie }} - {{ series.folio }}
                                </li>
                            </ul>
                        </div>




                        <div class="col-span-12 sm:col-span-12 md:col-span-3">
                            <label for="fecha" class="form-label text-[.875rem] text-black">Fecha:</label>
                            <select class="block w-full rounded-md sm:text-sm form-select !py-[0.59rem]" name="fecha"
                                id="fecha" formControlName="fecha">
                                <option value="">Selecciona la fecha</option>
                                @for (fecha of listadoFechas; track $index) {
                                <option value="{{fecha.fecha}}">{{ fecha.fecha }}</option>
                                }
                            </select>
                            @if (isValidField('fecha')) {
                            <span class="text-[#EE312A] text-sm">
                                {{ getFieldError('fecha') }}
                            </span>
                            }
                        </div>
