<div class="grid grid-cols-12 gap-x-6">
  <div class="xl:col-span-12 col-span-12">
    <div class="box mt-4">
      <div class="box-body">
        <div class="contact-header">
          <div class="sm:flex block items-center justify-between">
            <div class="h5 font-semibold mb-0">Empresas</div>
            <div class="flex sm:mt-0 mt-2 items-center">
              <div class="input-group">
                <input
                  type="text"
                  class="form-control !rounded-s-sm w-full !bg-light !border-0"
                  placeholder="Buscar empresa"
                  aria-describedby="search-contact-member"
                  autocomplete="off"
                />
                <button
                  aria-label="button"
                  type="button"
                  class="ti-btn ti-btn-light !rounded-s-none !mb-0"
                  id="search-contact-member"
                >
                  <i
                    class="ri-search-line text-[#8C9097] dark:text-white/50"
                  ></i>
                </button>
              </div>
              <div class="hs-tooltip ti-main-tooltip">
                <button type="button" class="hs-tooltip-toggle ti-btn ti-btn-icon ti-btn-primary !ms-2 w-[2.313rem] h-[2.313rem]" data-hs-overlay="#hs-extralarge-modal"><i class="ri-add-line"></i>
                  <span class="hs-tooltip-content hs-dropdown-toggle ti-main-tooltip-content py-1 px-2 !bg-black !text-xs !font-medium !text-white shadow-sm" role="tooltip">
                    Crear Empresa
                  </span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <div class="xxl:col-span-3 xl:col-span-6 lg:col-span-6 md:col-span-6 sm:col-span-12 col-span-12">
    <div class="box">
      <div class="box-body contact-action">
        <div class="flex items-start">
          <div class="flex flex-grow flex-wrap gap-2">
            <div class="avatar avatar-xl avatar-rounded me-3">
              <img src="./images/faces/1.jpg" alt="" />
            </div>
            <div class="w-1/2"></div>
            <div>
              <p class="font-semibold text-[0.6875rem] mb-0">GEC150424BX8</p>
              <h6 class="mb-1 font-semibold text-[1rem]">
                Grupo Empresarial Cintegran
              </h6>
            </div>
            <div class="flex-container w-full">
              <div class="flex items-end flex-col">
                <button
                  type="button"
                  class="ti-btn ti-btn-primary-full text-[#000000] !font-medium"
                  data-hs-overlay="#hs-extralarge-modal"
                >
                  Entrar
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="hs-extralarge-modal" class="hs-overlay hidden ti-modal [--overlay-backdrop:static]">
    <div class="hs-overlay-open:mt-7 ti-modal-box mt-0 ease-out lg:!max-w-4xl lg:w-full m-3 lg:!mx-auto">
      <div class="ti-modal-content">
        <div class="ti-modal-header">
          <h6 class="ti-modal-title">Crear Empresa</h6>
        </div>
        <app-company-form></app-company-form>
      </div>
    </div>
  </div>

  <div id="loader" *ngIf="showLoader">
    <img src="./images/loader.svg" alt="" />
  </div>
</div>
