<div class="bg-gradient-to-r from-yellow-400 to-yellow-600  p-6 rounded-lg shadow mb-6">
    <h1 class="text-2xl font-bold text-center">Easysweb premia tu lealtad!!</h1>
  </div>
<div class=" mx-auto p-6 bg-white rounded-lg shadow-md">
   
    <p class="text-gray-600 mb-6">Recomendanos a tus amigos y gana fabulosos premios!</p>
  
    <p class="text-pink-600 mb-4">Campos requeridos *</p>
  
    <form class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
      <!-- Nombre -->
      <div>
        <label class="block text-gray-700 font-semibold mb-2">Nombre *</label>
        <div class="flex items-center border rounded-md overflow-hidden">
          <span class="bg-gray-200 p-2"><i class="fas fa-user"></i></span>
          <input type="text" class="w-full p-2 outline-none" placeholder="Nombre">
        </div>
      </div>
  
      <!-- Teléfono Oficina -->
      <div>
        <label class="block text-gray-700 font-semibold mb-2">Teléfono Oficina *</label>
        <div class="flex items-center border rounded-md overflow-hidden">
          <span class="bg-gray-200 p-2"><i class="fas fa-phone"></i></span>
          <input type="text" class="w-full p-2 outline-none" placeholder="+52">
        </div>
      </div>
  
      <!-- Teléfono Móvil -->
      <div>
        <label class="block text-gray-700 font-semibold mb-2">Teléfono Móvil *</label>
        <div class="flex items-center border rounded-md overflow-hidden">
          <span class="bg-gray-200 p-2"><i class="fas fa-mobile-alt"></i></span>
          <input type="text" class="w-full p-2 outline-none" placeholder="Celular">
        </div>
      </div>
  
      <!-- E-mail -->
      <div>
        <label class="block text-gray-700 font-semibold mb-2">E-mail *</label>
        <div class="flex items-center border rounded-md overflow-hidden">
          <span class="bg-gray-200 p-2"><i class="fas fa-envelope"></i></span>
          <input type="email" class="w-full p-2 outline-none" placeholder="ejemplo@demo.com">
        </div>
      </div>
    </form>
  
    <!-- Botón Agregar -->
    <div class="flex justify-start mb-6">
      <button class="flex items-center px-6 py-2 bg-white border-2 border-purple-500 text-purple-600 font-semibold rounded-full hover:bg-purple-100">
        Agregar Amigo
        <i class="fas fa-user-plus ml-2"></i>
      </button>
    </div>
  
    <!-- Tabla -->
    <div class="overflow-x-auto">
      <table class="w-full text-left text-gray-700">
        <thead class="border-b-2">
          <tr>
            <th class="px-4 py-2">Nombre</th>
            <th class="px-4 py-2">Teléfono Oficina</th>
            <th class="px-4 py-2">Teléfono Cel.</th>
            <th class="px-4 py-2">Correo electrónico</th>
            <th class="px-4 py-2">Status</th>
          </tr>
        </thead>
        <tbody>
          <!-- Aquí irían los registros -->
        </tbody>
      </table>
    </div>
  </div>
